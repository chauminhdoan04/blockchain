<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <style>
    .box { fill:#f8fafc; stroke:#1f2937; stroke-width:1.5; rx:8; }
    .title { font: 600 14px 'Segoe UI', Roboto, Arial; fill:#0f172a }
    .label { font: 400 12px 'Segoe UI', Roboto, Arial; fill:#0f172a }
    .small { font: 400 11px 'Segoe UI', Roboto, Arial; fill:#475569 }
    .arrow { stroke:#0f172a; stroke-width:1.6; fill:none; marker-end:url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0f172a" />
    </marker>
  </defs>

  <!-- Users -->
  <rect x="40" y="40" width="160" height="60" class="box"/>
  <text x="120" y="70" class="title" text-anchor="middle">Owner / Farmer</text>

  <rect x="40" y="120" width="160" height="60" class="box"/>
  <text x="120" y="150" class="title" text-anchor="middle">Doctor / Vet</text>

  <!-- Frontend -->
  <rect x="260" y="80" width="220" height="80" class="box"/>
  <text x="370" y="110" class="title" text-anchor="middle">Frontend</text>
  <text x="370" y="130" class="small" text-anchor="middle">React + Vite</text>

  <!-- Wallet -->
  <rect x="520" y="60" width="160" height="60" class="box"/>
  <text x="600" y="90" class="title" text-anchor="middle">Wallet</text>
  <text x="600" y="108" class="small" text-anchor="middle">MetaMask / Browser</text>

  <!-- Provider -->
  <rect x="520" y="140" width="160" height="60" class="box"/>
  <text x="600" y="170" class="title" text-anchor="middle">Provider</text>
  <text x="600" y="188" class="small" text-anchor="middle">ethers.BrowserProvider</text>

  <!-- Node & Testnet -->
  <rect x="760" y="40" width="180" height="60" class="box"/>
  <text x="850" y="70" class="title" text-anchor="middle">Hardhat node</text>
  <text x="850" y="88" class="small" text-anchor="middle">rpc://127.0.0.1:8545</text>

  <rect x="760" y="120" width="180" height="60" class="box"/>
  <text x="850" y="150" class="title" text-anchor="middle">Public Testnet</text>
  <text x="850" y="168" class="small" text-anchor="middle">Goerli / Sepolia / Mainnet</text>

  <!-- Contract and Chain -->
  <rect x="980" y="80" width="180" height="60" class="box"/>
  <text x="1070" y="110" class="title" text-anchor="middle">Contract</text>
  <text x="1070" y="128" class="small" text-anchor="middle">CowManager (Solidity)</text>

  <rect x="980" y="160" width="180" height="40" class="box"/>
  <text x="1070" y="185" class="small" text-anchor="middle">Blockchain (state)</text>

  <!-- Repo / Artifacts / Tools -->
  <rect x="40" y="220" width="220" height="80" class="box"/>
  <text x="150" y="255" class="title">GitHub Repo</text>
  <text x="150" y="275" class="small">contracts, scripts, frontend, artifacts</text>

  <rect x="300" y="220" width="220" height="60" class="box"/>
  <text x="410" y="250" class="title">Artifacts</text>
  <text x="410" y="268" class="small">ABI & TypeChain</text>

  <rect x="560" y="220" width="220" height="60" class="box"/>
  <text x="670" y="250" class="title">Tools</text>
  <text x="670" y="268" class="small">Hardhat / ethers.js / Deploy</text>

  <!-- Arrows -->
  <path d="M200 70 L260 90" class="arrow" />
  <path d="M200 150 L260 120" class="arrow" />

  <path d="M480 120 L520 90" class="arrow" />
  <path d="M680 90 L760 70" class="arrow" />
  <path d="M680 160 L760 150" class="arrow" />

  <path d="M880 70 L980 110" class="arrow" />
  <path d="M880 150 L980 160" class="arrow" />

  <path d="M140 220 L300 240" class="arrow" />
  <path d="M520 240 L560 240" class="arrow" />
  <path d="M480 240 L480 200 L680 200" class="arrow" />

  <!-- Labels on arrows -->
  <text x="330" y="100" class="label">connect via Web3</text>
  <text x="760" y="40" class="label">RPC</text>

  <!-- Footer note -->
  <text x="40" y="330" class="small">Generated diagram (static SVG) — use Mermaid CLI locally to export PNG from `docs/diagram.mmd`</text>
</svg>
